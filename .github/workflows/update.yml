# Rebuilds the league page from the latest NFL data and publishes it.
# Runs every 6 hours, whenever the commissioner edits league.json, or on demand
# (Actions tab -> "Update scores" -> "Run workflow").
name: Update scores

on:
  schedule:
    - cron: "17 */6 * * *"     # 00:17, 06:17, 12:17, 18:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["league.json", "site/**", "scripts/**"]

permissions:
  contents: write

concurrency:
  group: update-scores
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Download schedule, play-by-play and referees
        run: python3 -I scripts/fetch_data.py cache

      - name: Score every flag
        run: python3 -I scripts/build_data.py cache data.json

      - name: Render the page
        run: python3 -I scripts/render.py

      - name: Publish if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json index.html data/referees.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update scores $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # Runs after publishing, so scores still update. Failing here makes GitHub email the
      # commissioner while a week is on hold because a game's referee isn't known.
      - name: Check for weeks on hold
        run: >-
          python3 -I -c 'import json, sys;
          held = json.load(open("data.json"))["held"];
          [print("::error::Week %s on hold: %s (%s) - %s" % (h["week"], h["game"], h["gid"], h["why"])) for h in held];
          sys.exit(1 if held else 0)'
